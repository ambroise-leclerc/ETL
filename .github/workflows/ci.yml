name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  source-policy:
    name: source policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the source policy checker
        run: python3 tools/check_libstd_namespace.py --self-test

      - name: Check supported AVR device matrix
        run: |
          python3 tools/test_avr_matrix.py
          python3 tools/check_avr_matrix.py

      - name: Check ETLSTD and repository-qualified standard includes
        run: python3 tools/check_libstd_namespace.py

  host-tests:
    name: host (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported host compiler
          - name: gcc-13
            cxx: g++-13
            packages: g++-13 cmake make
          - name: gcc-14
            container: gcc:14
            cxx: g++
            packages: cmake
          - name: gcc-15
            container: gcc:15
            cxx: g++
            packages: cmake
          - name: gcc-16
            container: gcc:16
            cxx: g++
            packages: cmake
          - name: clang-18
            cxx: clang++-18
            packages: clang-18 cmake make

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y ${{ matrix.packages }}

      - name: Show host compiler
        run: ${{ matrix.cxx }} --version | head -n 1

      - name: Configure host build
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build host tests
        run: cmake --build build

      - name: Run host tests
        run: ctest --test-dir build --output-on-failure

  avr-smoke:
    needs: avr-matrix
    name: avr (${{ matrix.toolchain.name }}, ${{ matrix.target.mcu }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(needs.avr-matrix.outputs.toolchains) }}
        target: ${{ fromJSON(needs.avr-matrix.outputs.regression) }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache AVR toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: avr-toolchain-${{ matrix.toolchain.sha256 }}

      - name: Download AVR toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          archive="${RUNNER_TEMP}/$(basename "${{ matrix.toolchain.url }}")"
          curl -fsSL -o "${archive}" "${{ matrix.toolchain.url }}"
          echo "${{ matrix.toolchain.sha256 }}  ${archive}" | sha256sum --check
          mkdir -p toolchain
          tar -xaf "${archive}" -C toolchain

      - name: Add AVR toolchain to PATH
        run: find "${PWD}/toolchain" -type f -name avr-g++ -printf '%h\n' | head -n 1 >> "${GITHUB_PATH}"

      - name: Show AVR compiler
        run: avr-g++ --version | head -n 1

      - name: Configure AVR smoke build
        run: >
          cmake -S . -B build-avr
          -DCMAKE_TOOLCHAIN_FILE=cmake/avr-gcc-toolchain.cmake
          -DETL_BUILD_HOST_TESTS=OFF
          -DETL_BUILD_AVR_SMOKE=ON
          -DETL_AVR_MCU=${{ matrix.target.mcu }}
          -DETL_AVR_F_CPU=${{ matrix.target.f_cpu }}

      - name: Build AVR smoke target
        run: cmake --build build-avr

      - name: Check ETLStd package and profile boundaries
        run: ctest --test-dir build-avr -R etlstd-profile --output-on-failure

      - name: Check HEX outputs
        run: |
          test -f build-avr/etl_avr_smoke.hex
          test -f build-avr/etl_avr_libstd_smoke.hex
          test -f build-avr/etl_avr_user_isr_smoke.hex
          test -f build-avr/etl_avr_uart0_smoke.hex
          test -f build-avr/etl_avr_multi_tu_smoke.hex
          test -f build-avr/etl_avr_custom_new_smoke.hex
          test -f build-avr/etl_avr_interrupt_smoke.hex

      - name: Check interrupt handlers
        run: |
          # Handlers attached with etl::Interrupt generate the same code as avr-libc ISR()
          .github/scripts/compare-isr.sh build-avr/etl_avr_isr_equivalence_etl.elf \
            build-avr/etl_avr_isr_equivalence_libc.elf ${{ matrix.target.timer0_vectors }}
          # Two handlers on the same vector: the build must fail on the duplicate vector
          if cmake --build build-avr --target etl_avr_interrupt_conflict > interrupt_conflict.log 2>&1; then
            echo "Duplicate interrupt vector not detected"; exit 1
          fi
          grep "is already defined" interrupt_conflict.log

      - name: Build for every supported MCU
        if: matrix.target.mcu == 'atmega328p'
        run: |
          python3 tools/check_avr_matrix.py --devices > "$RUNNER_TEMP/avr-devices"
          while read -r mcu f_cpu; do
            echo "::group::${mcu}"
            avr-g++ -std=c++23 -mmcu=${mcu} -DF_CPU=${f_cpu} -Os -Wall -Werror -Wno-literal-suffix \
              -isystem libstd/include/c++/v1 -I. -Iinclude examples/avr/device_smoke.cpp -o device_smoke_${mcu}.elf
            echo "::endgroup::"
          done < "$RUNNER_TEMP/avr-devices"

      - name: Check allocation functions
        run: |
          # ETL provides weak allocation functions, shared by all translation units
          avr-nm build-avr/etl_avr_multi_tu_smoke.elf | grep -q ' W _Znwj$'
          # A user definition replaces them
          avr-nm build-avr/etl_avr_custom_new_smoke.elf | grep -q ' T _Znwj$'
          # Array forms the user did not replace stay on FreeStore: delete[] must not reach the
          # user's scalar operator delete
          avr-objdump -d build-avr/etl_avr_custom_new_smoke.elf > custom_new.lst
          for f in _ZdaPv _ZdaPvj; do
            grep -q "<${f}>:" custom_new.lst
            if awk -v f="<${f}>:" '$2 == f {on = 1; next} on && /^$/ {exit} on' custom_new.lst | grep -qE '<_ZdlPvj?>'; then
              echo "${f} reaches the user's scalar operator delete"; exit 1
            fi
          done

      - name: Check USART vectors
        if: matrix.target.mcu == 'atmega328p'
        run: |
          # User ISR only: ETL must leave the USART vectors alone
          test "$(avr-nm build-avr/etl_avr_user_isr_smoke.elf | grep -c ' T __vector_')" -eq 1
          # Uart0 started: ETL installs the RX and UDRE handlers
          avr-nm build-avr/etl_avr_uart0_smoke.elf | grep -q ' T __vector_18$'
          avr-nm build-avr/etl_avr_uart0_smoke.elf | grep -q ' T __vector_19$'
          # User ISR on a vector taken by Uart0: the build must fail on the duplicate vector
          if cmake --build build-avr --target etl_avr_uart0_isr_conflict > conflict.log 2>&1; then
            echo "Duplicate USART vector not detected"; exit 1
          fi
          grep "__vector_18' is already defined" conflict.log

      - name: Report binary sizes
        run: |
          {
            echo "### ${{ matrix.toolchain.name }} / ${{ matrix.target.mcu }}"
            echo '```'
            avr-size build-avr/*.elf
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  avr-matrix:
    name: AVR profile matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      regression: ${{ steps.matrix.outputs.regression }}
      toolchains: ${{ steps.matrix.outputs.toolchains }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          toolchains=$(python3 -c 'import json; print(json.dumps(json.load(open("tools/avr_toolchains.json")), separators=(",", ":")))')
          echo "toolchains=$toolchains" >> "$GITHUB_OUTPUT"
          matrix=$(python3 tools/check_avr_matrix.py --github)
          regression=$(python3 tools/check_avr_matrix.py --github-regression)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "regression=$regression" >> "$GITHUB_OUTPUT"

  avr-profiles:
    name: AVR profile (${{ matrix.toolchain.name }}, ${{ matrix.target.mcu }}, ${{ matrix.target.profile }})
    needs: avr-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        toolchain: ${{ fromJSON(needs.avr-matrix.outputs.toolchains) }}
        target: ${{ fromJSON(needs.avr-matrix.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache AVR toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: avr-toolchain-${{ matrix.toolchain.sha256 }}

      - name: Download AVR toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          archive="${RUNNER_TEMP}/$(basename "${{ matrix.toolchain.url }}")"
          curl -fsSL -o "$archive" "${{ matrix.toolchain.url }}"
          echo "${{ matrix.toolchain.sha256 }}  $archive" | sha256sum --check
          mkdir -p toolchain
          tar -xaf "$archive" -C toolchain

      - name: Add AVR toolchain to PATH
        run: find "$PWD/toolchain" -type f -name avr-g++ -printf '%h\n' | head -n 1 >> "$GITHUB_PATH"

      - name: Configure profile smoke
        run: >
          cmake -S . -B build-avr
          -DCMAKE_TOOLCHAIN_FILE=cmake/avr-gcc-toolchain.cmake
          -DETL_BUILD_HOST_TESTS=OFF
          -DETL_BUILD_AVR_SMOKE=ON
          -DETL_AVR_MCU=${{ matrix.target.mcu }}
          -DETL_AVR_F_CPU=${{ matrix.target.f_cpu }}

      - name: Compile, link and check profile artifacts
        run: cmake --build build-avr --target etl_avr_std_${{ matrix.target.profile }}_smoke_check --parallel 2

      - name: Upload ELF, HEX and link map
        uses: actions/upload-artifact@v4
        with:
          name: avr-${{ matrix.toolchain.name }}-${{ matrix.target.mcu }}-${{ matrix.target.profile }}
          path: |
            build-avr/etl_avr_std_${{ matrix.target.profile }}_smoke.elf
            build-avr/etl_avr_std_${{ matrix.target.profile }}_smoke.hex
            build-avr/etl_avr_std_${{ matrix.target.profile }}_smoke.map
          if-no-files-found: error

  # Single required check for branch protection, independent of the matrix contents
  ci-ok:
    name: ci-ok
    if: always()
    needs: [source-policy, host-tests, avr-smoke, avr-matrix, avr-profiles]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that all CI jobs succeeded
        run: |
          echo "source-policy: ${{ needs.source-policy.result }}"
          echo "host-tests: ${{ needs.host-tests.result }}"
          echo "avr-smoke: ${{ needs.avr-smoke.result }}"
          test "${{ needs.avr-matrix.result }}" = success
          test "${{ needs.avr-profiles.result }}" = success
          test "${{ needs.source-policy.result }}" = success
          test "${{ needs.host-tests.result }}" = success
          test "${{ needs.avr-smoke.result }}" = success
